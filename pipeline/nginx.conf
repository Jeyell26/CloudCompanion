limit_req_zone $binary_remote_addr zone=logpulse_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=logpulse_conn:10m;

server {
    listen 80;
    server_name _;

    location / {
        root /var/www/logpulse/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=logpulse_api burst=20 nodelay;
        limit_conn logpulse_conn 5;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }
}
